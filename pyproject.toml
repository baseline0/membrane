[project]
name = "malta"
version = "0.1.0"
description = "Membrane-computing simulation (P System) built on anytree/networkx"
readme = "README.md"
authors = [
    { name = "Mark Alexiuk", email = "malexiuk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anytree>=2.12.1",
    "deap>=1.4.1",
    "matplotlib>=3.10.0",
    "multiset>=3.1.0",
    "networkx>=3.4.2",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "sympy>=1.14.0,<1.15.0",  # Pinned minor: formula rendering must be deterministic
    "typer>=0.15.1",
]

[project.scripts]
malta = "malta.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["malta"]

[dependency-groups]
dev = [
    "deap>=1.4.1",
    "narwhals>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=7.0.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "ruff==0.16.8",
    "scipy>=1.13.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q"]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
norecursedirs = ["tests/cyprus"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "Use typer for CLIs (fleet mandate)."

[tool.ruff.lint.per-file-ignores]
# Legacy direct-run scripts: sys.path bootstrap must precede imports so the script runs without install.
"cyprus.py" = ["E402"]  # sys.path bootstrap before imports (legacy direct-run script)
"cyprus/program.py" = ["E402"]  # sys.path bootstrap before imports; base = get_base() sits between import groups
"demo.py" = ["E402"]  # sys.path bootstrap before imports (legacy direct-run script)
"tests/cyprus/test_flatten.py" = ["E402"]  # sys.path bootstrap before imports (legacy cyprus test, run directly)
"tests/cyprus/test_particle.py" = ["E402"]  # sys.path bootstrap before imports (legacy cyprus test, run directly)
# Public API name kept: FormatConverter.jsonToCyprus is a stub with no in-repo callers; renaming breaks the contract.
"cyprus/format_converter.py" = ["N802"]  # public method name kept (stub API)
# str-mixin Enum kept: str(member) returns 'DotColour.<name>' (see dot.py colour convention); StrEnum would return the bare value.
"malta/io/dot_colour.py" = ["UP042"]  # (str, Enum) kept: StrEnum would change str() of members
