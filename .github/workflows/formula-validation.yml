name: Formula Validation & Presentation Build

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/formula-validation.yml'
  pull_request:
    paths:
      - 'paper/**'

jobs:
  formulas:
    runs-on: ubuntu-latest
    name: Validate & Build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --all-groups
          npm install -g marp-cli

      - name: Validate formulas (strict mode)
        run: cd paper && python validate_formulas.py --strict
        continue-on-error: false

      - name: Export formulas
        run: cd paper && python model.py

      - name: Build presentation
        run: cd paper && marp presentation_generated.md -o presentation.pdf

      - name: Build paper
        run: cd paper && python build_paper.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-artifacts
          path: |
            paper/presentation*.pdf
            paper/formula_index.md
            paper/main.pdf
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const indexPath = './paper/formula_index.md';
            if (fs.existsSync(indexPath)) {
              const index = fs.readFileSync(indexPath, 'utf8');
              const summary = index.split('\n').slice(0, 10).join('\n');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ Formulas validated\n\n\`\`\`markdown\n${summary}\n\`\`\`\n\nFull index in artifacts.`
              });
            }
