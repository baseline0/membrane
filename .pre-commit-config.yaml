repos:
- hooks:
  - entry: bash -c 'grep -r "uv sync --group" .github/workflows/ && exit 1 || true'
    files: \.github/workflows/.*\.ya?ml$
    id: ci-sync-guard
    language: system
    name: Prevent uv sync --group in CI workflows
    pass_filenames: false
    stages:
    - commit
  repo: local
- hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
- hooks:
  - args:
    - --fix
    id: ruff
  - id: ruff-format
  repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.4
