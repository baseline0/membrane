repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: "[P3] Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "[P3] Fix end of file"
      - id: check-yaml
        name: "[P2] Validate YAML"
        args: [--unsafe]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: "[P2] Lint with ruff"
        args: [--fix]
      - id: ruff-format
        name: "[P2] Format with ruff"

  - repo: local
    hooks:
      # ===== P0: Critical Safety =====
      - id: ci-sync-guard
        name: "[P0] Prevent uv sync --group in CI"
        entry: bash -c 'grep -r "uv sync --group" .github/workflows/ && exit 1 || true'
        language: system
        files: \.github/workflows/.*\.ya?ml$
        pass_filenames: false
        stages:
          - commit

      # ===== P1: Architecture =====
      - id: python-syntax
        name: "[P1] Check Python syntax"
        entry: python -m py_compile
        language: system
        types:
          - python

      - id: ci-python-env
        name: "[P1] Enforce uv run for Python in CI"
        entry: bash -c 'grep -r "python " .github/workflows/ | grep -v "uv run python" && exit 1 || true'
        language: system
        files: \.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: npm-scoped-packages
        name: "[P1] Require scoped npm packages"
        entry: bash -c 'grep -r "npm install" .github/workflows/ | grep -v "@" && exit 1 || true'
        language: system
        files: \.github/workflows/.*\.ya?ml$
        pass_filenames: false
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: bash ../fleet-base/scripts/check-repo-root-pattern.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: validate-formulas
        name: "[P1] Validate formulas when presentation.md or model.py changes"
        entry: bash -c 'cd paper && uv run python validate_formulas.py'
        language: system
        pass_filenames: false
        files: '^paper/(presentation\.md|model\.py)$'
        stages: [pre-commit]
